name: Prévision quotidienne

on:
  schedule:
    # Heures en UTC (Paris = UTC+1 en hiver, UTC+2 en été). GitHub peut retarder ou sauter une tâche planifiée :
    # les deux lancements suivants sont des secours, ignorés si le calcul du jour a déjà réussi.
    - cron: "35 2 * * *"   # 03:35 à Paris en hiver, après la publication des données on-chain de la veille
    - cron: "35 5 * * *"   # secours : 06:35 à Paris en hiver
    - cron: "35 9 * * *"   # secours : 10:35 à Paris en hiver
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main
    inputs:
      backtest:
        description: "Refaire le backtest complet"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: prevision
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Calculer les prévisions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # facultatif : sans clé, analyse des titres par lexique
        run: |
          if [ "${{ github.event.inputs.backtest }}" = "true" ]; then
            python -m src.main --force-backtest
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            python -m src.main --si-pas-fait
          else
            python -m src.main
          fi

      - name: Enregistrer les résultats
        run: |
          git config user.name "btc-model-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Prévision du $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push
